    <!-- Schema.org JSON-LD Structured Data -->

            "email": "mohitgujjar2121@gmail.com",
            "telephone": "+91 7850980009",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Chandigarh",
              "addressCountry": "IN"
            },
            "alumniOf": [
              {
                "@type": "EducationalOrganization",
                "name": "Panjab University, Chandigarh",
                "department": "Master of Computer Applications (MCA)"
              },
              {
                "@type": "EducationalOrganization",
                "name": "DAV College, Chandigarh",
                "department": "Bachelor of Computer Applications (BCA)"
              }
            ],
            "knowsAbout": [
              "React.js",

              "Dynamic SEO & JSON-LD"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "#website",
            "name": "Mohit — Full-Stack Developer Portfolio",
            "description": "Portfolio of Mohit, Full-Stack Developer specializing in React, React Native, Next.js, Expo, Node.js, and Express microservices.",
            "author": {
              "@id": "#mohit"
            }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#F8F5EE" id="theme-color-meta" />
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("portfolio_theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          if (saved === "dark" || (!saved && prefersDark)) {
            document.documentElement.classList.add("dark");
            const meta = document.getElementById("theme-color-meta");
            if (meta) meta.setAttribute("content", "#11141A");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

  <body
    class="bg-[#F8F5EE] dark:bg-[#11141A] text-[#2C2419] dark:text-[#E8DFD1] transition-colors duration-300 antialiased selection:bg-[#EAD8B7] dark:selection:bg-[#3D4A5E] selection:text-[#3D3325] dark:selection:text-[#F8F5EE]"
  >
